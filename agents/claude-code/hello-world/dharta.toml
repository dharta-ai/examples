# --- Identity -------------------------------------------------------------
# This agent's name, unique within your Dharta org. Deploying again with the
# same name OVERWRITES that agent. Lowercase letters, digits, hyphens.
name = "hello-world-claude-code"

# Deploy gate. Only agents with deploy = true ship on `dharta deploy` /
# `git push dharta`. Absent or false = configured but not deployed.
deploy = true

# --- Build ----------------------------------------------------------------
# OMIT this whole section for a harness-only agent (a CLAUDE.md / .claude
# folder) - Dharta serves it as-is, no build step.
#   "python" - Python project; Dharta builds it (set entry_point below)
#   "node"   - Node project; Dharta builds it
# buildpack = "python"

# Import path "module:attribute" to your app object. Required ONLY when
# buildpack is set; omit for harness-only agents.
# entry_point = "app:app"

# --- Harness --------------------------------------------------------------
# The agent runtime this agent runs on. `type` is fixed for the life of the
# agent (switching harness = a new agent). `version` is optional: a range
# like "2" resolves to the latest matching version Dharta supports at deploy
# time; omit it for the curated default; pin an exact version only when you
# need determinism (it must be one Dharta supports - `dharta deploy` checks).
[harness]
type = "claude-code"
# version = "2"

# --- Environment (declare-or-bind) ----------------------------------------
# Names this agent needs. Bind locally in .env, in prod via `dharta env set`.
# A required var with no prod binding fails the build.
[env]
# SUPPORT_DB_URL = { required = false, description = "Support database DSN" }
